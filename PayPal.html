<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayPal</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --keyboard-bg: #d1d4d9;
            --key-bg: #ffffff;
            --paypal-blue: #0033aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Header Area */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            margin-top: 10px;
        }

        .back-button {
            font-size: 28px;
            width: 40px;
            cursor: pointer;
        }

        .header-title {
            flex-grow: 1;
            text-align: center;
            font-size: 17px;
            font-weight: 400;
            margin-right: 40px;
        }

        /* Recipient Section */
        .recipient-section {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            gap: 16px;
        }

        #avatar {
            width: 64px;
            height: 64px;
            background-color: var(--paypal-blue);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: 500;
            font-size: 20px;
            flex-shrink: 0;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.1s;
        }

        #avatar:active {
            opacity: 0.8;
        }

        #avatar svg {
            width: 32px;
            height: 32px;
            fill: white;
            display: none; 
        }

        .recipient-input-wrapper {
            flex-grow: 1;
            overflow: hidden; /* Critical for scaling */
        }

        #nameInput {
            width: 100%;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: 500;
            background: transparent;
            padding: 4px 0;
            white-space: nowrap;
            transform-origin: left center; /* Scales from the left side */
        }

        /* Amount Input */
        .amount-container {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            margin-top: 10px;
            overflow: hidden;
            max-width: 100%;
        }

        .currency-symbol {
            font-size: 52px;
            font-weight: 400;
            flex-shrink: 0;
        }

        #amountDisplay {
            font-size: 52px;
            font-weight: 400;
            border: none;
            outline: none;
            background: transparent;
            margin-left: 2px;
            white-space: nowrap;
            display: inline-block;
            transform-origin: left center;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 45px;
            background-color: #000;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            flex-shrink: 0;
        }

        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }

        .currency-selector {
            margin-left: auto;
            border: 1px solid #000;
            border-radius: 20px;
            padding: 5px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* Note and Next Row */
        .bottom-actions {
            margin-top: auto;
            padding: 0 16px 16px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .note-field {
            background-color: #f2f2f7;
            border-radius: 22px;
            padding: 14px 20px;
            font-size: 17px;
            color: #8e8e93;
            flex-grow: 1;
            border: none;
            outline: none;
        }

        .next-btn {
            background-color: #000000;
            color: white;
            padding: 14px 34px;
            border-radius: 26px;
            font-weight: 600;
            font-size: 17px;
            border: none;
            white-space: nowrap;
        }

        /* Keyboard Layout */
        .keyboard {
            background-color: var(--keyboard-bg);
            padding: 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding-bottom: 30px;
        }

        .key {
            background: var(--key-bg);
            height: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
            cursor: pointer;
            user-select: none;
        }

        .key:active {
            background-color: #abb1b7;
        }

        .key span:first-child {
            font-size: 25px;
            font-weight: 400;
        }

        .key span:last-child {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: -2px;
        }

        .key-special {
            background: transparent;
            box-shadow: none;
        }

        .key-special:active {
            background: transparent;
            opacity: 0.6;
        }

        .backspace-icon {
            width: 24px;
            height: 18px;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="back-button">✕</div>
        <div class="header-title">Senden</div>
    </div>

    <div class="recipient-section">
        <div id="avatar">
            <span id="avatarText">LM</span>
            <svg id="avatarIcon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>
        <div class="recipient-input-wrapper">
            <input type="text" id="nameInput" value="Lukas Müller" spellcheck="false">
        </div>
    </div>

    <div class="amount-container">
        <span class="currency-symbol">€</span>
        <span id="amountDisplay">50</span>
        <span class="cursor"></span>
        <div class="currency-selector">
            EUR <span>∨</span>
        </div>
    </div>

    <div class="bottom-actions">
        <input type="text" class="note-field" placeholder="Notiz hinzufügen">
        <button class="next-btn">Weiter</button>
    </div>

    <div class="keyboard" id="customKeyboard">
        <div class="key" data-val="1"><span>1</span><span></span></div>
        <div class="key" data-val="2"><span>2</span><span>ABC</span></div>
        <div class="key" data-val="3"><span>3</span><span>DEF</span></div>
        <div class="key" data-val="4"><span>4</span><span>GHI</span></div>
        <div class="key" data-val="5"><span>5</span><span>JKL</span></div>
        <div class="key" data-val="6"><span>6</span><span>MNO</span></div>
        <div class="key" data-val="7"><span>7</span><span>PQRS</span></div>
        <div class="key" data-val="8"><span>8</span><span>TUV</span></div>
        <div class="key" data-val="9"><span>9</span><span>WXYZ</span></div>
        <div class="key key-special" data-val="."><span>.</span></div>
        <div class="key" data-val="0"><span>0</span><span></span></div>
        <div class="key key-special" data-val="back">
            <svg class="backspace-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('nameInput');
        const avatar = document.getElementById('avatar');
        const avatarText = document.getElementById('avatarText');
        const avatarIcon = document.getElementById('avatarIcon');
        const amountDisplay = document.getElementById('amountDisplay');
        const keys = document.querySelectorAll('.key');

        /**
         * Function to scale text down if it exceeds the parent container width
         */
        function adjustFontSize(element, originalSize) {
            const parentWidth = element.parentElement.clientWidth;
            // Reset to original size first to calculate true scrollWidth
            element.style.fontSize = originalSize + 'px';
            
            let currentWidth = element.scrollWidth;
            
            if (currentWidth > parentWidth) {
                const ratio = parentWidth / currentWidth;
                const newSize = Math.floor(originalSize * ratio);
                element.style.fontSize = newSize + 'px';
            }
        }

        // Initialize sizes
        window.addEventListener('load', () => {
            adjustFontSize(nameInput, 18);
            adjustFontSize(amountDisplay, 52);
        });

        // Toggle logic: Switch between Initials and Icon
        avatar.addEventListener('click', () => {
            if (avatarIcon.style.display === 'block') {
                avatarIcon.style.display = 'none';
                avatarText.style.display = 'block';
            } else {
                avatarIcon.style.display = 'block';
                avatarText.style.display = 'none';
            }
        });

        // Update Avatar Text & Scale Name
        nameInput.addEventListener('input', () => {
            const names = nameInput.value.trim().split(' ');
            let initials = "";
            if (names.length >= 2) {
                initials = names[0].charAt(0) + names[names.length - 1].charAt(0);
            } else if (names.length === 1) {
                initials = names[0].charAt(0);
            }
            avatarText.innerText = initials.toUpperCase() || "?";
            
            // Apply scaling
            adjustFontSize(nameInput, 18);
        });

        // Keyboard logic
        keys.forEach(key => {
            key.addEventListener('click', () => {
                const val = key.getAttribute('data-val');
                let currentAmount = amountDisplay.innerText;

                if (val === 'back') {
                    amountDisplay.innerText = currentAmount.slice(0, -1);
                } else {
                    if (val === '.' && currentAmount.includes('.')) return;
                    // Removed the 8 character limit so you can test the scaling!
                    amountDisplay.innerText = currentAmount + val;
                }
                
                // Apply scaling to amount
                adjustFontSize(amountDisplay, 52);
            });
        });

        amountDisplay.addEventListener('click', () => {
            nameInput.blur();
        });
    </script>
</body>
</html>
